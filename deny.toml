# Dependency policy for keylease-core.
#
# Run locally after `cargo install cargo-deny --locked`:
#   cargo deny check
#
# CI runs the same checks in the "Dependency Policy" job. Keep this file
# reviewed: an allow-list entry is a deliberate decision, not a formality.

[graph]
# The Wasm release build is the deployed artifact; check that normal graph.
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
ignore = [
    # Transitive through soroban-env-host 26, which pins crypto-bigint 0.5.x
    # through elliptic-curve 0.13. The affected constant-time operations are
    # not exposed by this contract. Revisit when the SDK moves to 0.7.6+.
    { id = "RUSTSEC-2026-0387", reason = "transitive via soroban-env-host, no compatible upgrade yet" },
    # Build-time proc-macro dependency of the Soroban spec generator. It is
    # unmaintained, not vulnerable, and has no safe upgrade in this dependency
    # tree. Track it with the SDK upgrade instead of suppressing silently.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-only dependency of soroban-spec-rust" },
]

[licenses]
# Fail when the license of a dependency cannot be determined confidently.
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
exceptions = []

[bans]
# Duplicate versions are worth fixing but often come from the SDK's own tree.
multiple-versions = "warn"
# A wildcard requirement makes builds non-reproducible.
wildcards = "deny"

[sources]
# Only crates.io is allowed; a git or alternative-registry dependency needs an
# explicit review and an entry here.
unknown-registry = "deny"
unknown-git = "deny"
